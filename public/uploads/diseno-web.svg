<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="webBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="webShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.5" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#webBgGrad)" />
  <circle cx="250" cy="180" r="180" fill="#2563eb" opacity="0.15" />
  <circle cx="600" cy="400" r="160" fill="#38bdf8" opacity="0.12" />

  <!-- Main Laptop Mockup -->
  <g transform="translate(140, 80)" filter="url(#webShadow)">
    <!-- Screen Frame -->
    <rect width="520" height="340" rx="14" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <!-- Browser Top Bar -->
    <rect width="520" height="36" rx="14" fill="#1e293b" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <rect x="74" y="8" width="280" height="20" rx="6" fill="#0f172a" />
    <text x="180" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">https://tuempresa.com</text>

    <!-- Screen Website Content -->
    <!-- Hero Banner -->
    <rect x="20" y="56" width="480" height="130" rx="10" fill="url(#brandGrad)" />
    <text x="45" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff">Diseño Web Profesional</text>
    <text x="45" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#f0fdf4">Tiendas Virtuales • Landing Pages • Catálogos</text>
    <rect x="45" y="146" width="100" height="24" rx="12" fill="#ffffff" />
    <text x="95" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">Ver Más</text>

    <!-- Cards Row -->
    <rect x="20" y="202" width="150" height="110" rx="8" fill="#1e293b" />
    <circle cx="45" cy="228" r="12" fill="#38bdf8" />
    <rect x="65" y="224" width="80" height="8" rx="3" fill="#cbd5e1" />
    <rect x="35" y="250" width="115" height="6" rx="2" fill="#64748b" />
    <rect x="35" y="262" width="90" height="6" rx="2" fill="#64748b" />

    <rect x="185" y="202" width="150" height="110" rx="8" fill="#1e293b" />
    <circle cx="210" cy="228" r="12" fill="#4ade80" />
    <rect x="230" y="224" width="80" height="8" rx="3" fill="#cbd5e1" />
    <rect x="200" y="250" width="115" height="6" rx="2" fill="#64748b" />
    <rect x="200" y="262" width="90" height="6" rx="2" fill="#64748b" />

    <rect x="350" y="202" width="150" height="110" rx="8" fill="#1e293b" />
    <circle cx="375" cy="228" r="12" fill="#a855f7" />
    <rect x="395" y="224" width="80" height="8" rx="3" fill="#cbd5e1" />
    <rect x="365" y="250" width="115" height="6" rx="2" fill="#64748b" />
    <rect x="365" y="262" width="90" height="6" rx="2" fill="#64748b" />

    <!-- Laptop Base -->
    <path d="M -40 340 L 560 340 L 530 355 L -10 355 Z" fill="#334155" />
    <rect x="220" y="340" width="80" height="6" rx="3" fill="#475569" />
  </g>

  <!-- Floating Badge -->
  <g transform="translate(180, 480)" filter="url(#webShadow)">
    <rect width="440" height="70" rx="14" fill="#0f172a" stroke="#2563eb" stroke-width="2" />
    <circle cx="40" cy="35" r="20" fill="#2563eb" opacity="0.25" />
    <text x="40" y="42" font-family="system-ui, sans-serif" font-size="20" fill="#38bdf8" text-anchor="middle">💻</text>
    <text x="75" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff">SERVICIOS DIGITALES</text>
    <text x="75" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Sitios Web Responsivos • Tiendas Online • Landing Pages</text>
  </g>
</svg>
