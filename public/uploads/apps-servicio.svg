<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.5" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Background Glows -->
  <circle cx="200" cy="180" r="160" fill="#38bdf8" opacity="0.12" filter="blur(40px)" />
  <circle cx="620" cy="380" r="180" fill="#c084fc" opacity="0.15" filter="blur(50px)" />

  <!-- Web Browser Window (Behind) -->
  <g transform="translate(100, 90)" filter="url(#shadow)">
    <!-- Browser Frame -->
    <rect width="480" height="320" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <!-- Header -->
    <rect width="480" height="38" rx="16" fill="#0f172a" />
    <circle cx="24" cy="19" r="6" fill="#ef4444" />
    <circle cx="44" cy="19" r="6" fill="#f59e0b" />
    <circle cx="64" cy="19" r="6" fill="#10b981" />
    <rect x="90" y="9" width="220" height="20" rx="6" fill="#1e293b" />
    <text x="200" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">app.tudominio.com</text>

    <!-- Content Mockup -->
    <rect x="24" y="60" width="130" height="70" rx="10" fill="#334155" opacity="0.6" />
    <rect x="170" y="60" width="130" height="70" rx="10" fill="#334155" opacity="0.6" />
    <rect x="316" y="60" width="140" height="70" rx="10" fill="url(#accentGrad)" opacity="0.85" />

    <rect x="24" y="150" width="280" height="18" rx="6" fill="#475569" opacity="0.6" />
    <rect x="24" y="180" width="220" height="12" rx="4" fill="#334155" opacity="0.7" />
    <rect x="24" y="202" width="260" height="12" rx="4" fill="#334155" opacity="0.7" />

    <!-- Chart lines in browser -->
    <path d="M 40 280 Q 120 220 200 250 T 360 210 T 440 180" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Mobile Phone Mockup (In Front) -->
  <g transform="translate(480, 140)" filter="url(#shadow)">
    <!-- Phone Body -->
    <rect width="210" height="400" rx="36" fill="url(#phoneGrad)" stroke="#475569" stroke-width="4" />
    <!-- Screen Notch/Island -->
    <rect x="75" y="14" width="60" height="14" rx="7" fill="#020617" />
    <!-- Screen Content -->
    <rect x="14" y="40" width="182" height="344" rx="26" fill="#090d16" />

    <!-- App Card 1 -->
    <rect x="26" y="60" width="158" height="85" rx="14" fill="url(#accentGrad)" />
    <circle cx="50" cy="95" r="16" fill="#ffffff" opacity="0.25" />
    <rect x="76" y="82" width="90" height="10" rx="4" fill="#ffffff" />
    <rect x="76" y="98" width="60" height="8" rx="4" fill="#ffffff" opacity="0.8" />

    <!-- App List Items -->
    <rect x="26" y="160" width="158" height="46" rx="10" fill="#1e293b" />
    <circle cx="44" cy="183" r="10" fill="#38bdf8" />
    <rect x="64" y="176" width="70" height="8" rx="3" fill="#cbd5e1" />
    <rect x="64" y="188" width="45" height="6" rx="3" fill="#64748b" />

    <rect x="26" y="216" width="158" height="46" rx="10" fill="#1e293b" />
    <circle cx="44" cy="239" r="10" fill="#10b981" />
    <rect x="64" y="232" width="80" height="8" rx="3" fill="#cbd5e1" />
    <rect x="64" y="244" width="50" height="6" rx="3" fill="#64748b" />

    <rect x="26" y="272" width="158" height="46" rx="10" fill="#1e293b" />
    <circle cx="44" cy="295" r="10" fill="#f59e0b" />
    <rect x="64" y="288" width="65" height="8" rx="3" fill="#cbd5e1" />
    <rect x="64" y="300" width="40" height="6" rx="3" fill="#64748b" />

    <!-- Phone Bottom Bar -->
    <rect x="80" y="366" width="50" height="4" rx="2" fill="#64748b" />
  </g>

  <!-- Floating Badge: Modelo Suscripción -->
  <g transform="translate(80, 460)" filter="url(#shadow)">
    <rect width="360" height="80" rx="16" fill="#020617" stroke="#38bdf8" stroke-width="2" />
    <circle cx="42" cy="40" r="22" fill="#38bdf8" opacity="0.2" />
    <!-- Check / Repeat icon -->
    <path d="M 32 40 L 39 47 L 52 33" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="76" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">MODELO POR SUSCRIPCIÓN</text>
    <text x="76" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Inscripción inicial + mensualidad muy baja</text>
  </g>
</svg>
